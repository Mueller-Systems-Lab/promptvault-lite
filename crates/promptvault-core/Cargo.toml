[package]
name = "promptvault-core"
version = "1.13.2"
description = "Framework-free Rust core of PromptVault Lite (models, parser, scanner, analysis, database)"
authors = ["PromptVault Team"]
license = "MIT"
edition = "2021"
# Verified against the toolchain used to build this crate (deploy/Dockerfile).
rust-version = "1.85"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
uuid = { version = "1", features = ["v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled", "vtab"] }
walkdir = "2"
dunce = "1"
log = "0.4"

[dev-dependencies]
tempfile = "3"
