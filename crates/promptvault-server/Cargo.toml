[package]
name = "promptvault-server"
version = "1.13.1"
description = "HTTP server for PromptVault Lite (Web/LAN mode) wrapping promptvault-core"
authors = ["PromptVault Team"]
license = "MIT"
edition = "2021"
# Verified against the toolchain used to build this crate (deploy/Dockerfile).
rust-version = "1.85"

[dependencies]
promptvault-core = { path = "../promptvault-core" }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
dunce = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
