[package]
name = "promptvault-server"
version = "1.12.0"
description = "HTTP server for PromptVault Lite (Web/LAN mode) wrapping promptvault-core"
authors = ["PromptVault Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

# NOTE (issue #110/D1): the HTTP stack (axum/tokio/tower-http) is added in the
# server-endpoints change; this crate starts as a dependency-free binary that
# implements configuration loading and validation (fail-closed).

[dependencies]
promptvault-core = { path = "../promptvault-core" }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
