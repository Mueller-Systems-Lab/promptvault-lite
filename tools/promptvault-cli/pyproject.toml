[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptvault-lite-manager"
version = "1.11.1"
description = "PromptVault Lite — Local Prompt Management CLI Installer & Manager"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "PromptVault Contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

[project.scripts]
promptvault = "promptvault_cli.cli:main"

[project.urls]
Repository = "https://github.com/Mueller-Systems-Lab/promptvault-lite"

[tool.hatch.build.targets.wheel]
packages = ["src/promptvault_cli"]
