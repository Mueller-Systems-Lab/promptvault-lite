name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Release tag for provenance check (must be v1.9.0)"
        required: true
        default: "v1.9.0"
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish-v1.9.0
  cancel-in-progress: false

jobs:
  release-build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Fail-closed on unsupported release ref
        if: github.event.inputs.release_ref != 'v1.9.0'
        run: |
          echo "::error::release_ref must be 'v1.9.0' (got '${{ github.event.inputs.release_ref }}')"
          exit 1

      - name: Enforce master branch
        run: |
          test "$GITHUB_REF_NAME" = "master" || {
            echo "::error::STOP: publish must run from the master branch (got '$GITHUB_REF_NAME')"
            exit 1
          }

      - name: Checkout current packaging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runtime source is equivalent to v1.9.0
        run: |
          python - <<'PY'
          import subprocess
          import sys

          # Only package-name assertions are permitted to differ from v1.9.0.
          ALLOWED = {"tools/promptvault-cli/src/promptvault_cli/uninstall_cmd.py"}

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "v1.9.0", "HEAD", "--",
               "tools/promptvault-cli/src/promptvault_cli/"],
              text=True,
          ).split()

          unexpected = [f for f in changed if f not in ALLOWED]
          if unexpected:
              sys.exit(
                  "STOP_PYPI_RELEASE_PROVENANCE_MISMATCH: runtime source changed vs v1.9.0: "
                  + ", ".join(unexpected)
              )

          for f in changed:
              diff = subprocess.check_output(
                  ["git", "diff", "v1.9.0", "HEAD", "--", f], text=True
              )
              for line in diff.splitlines():
                  if line.startswith(("+++", "---", "@@", "diff ", "index ", "\\")):
                      continue
                  if not (line.startswith("+") or line.startswith("-")):
                      continue
                  content = line[1:]
                  if "promptvault-cli" in content or "promptvault-lite-manager" in content:
                      continue
                  sys.exit(
                      "STOP_PYPI_RELEASE_PROVENANCE_MISMATCH: non-name change in "
                      f"{f}: {line!r}"
                  )

          print("CLI_RUNTIME_SOURCE_EQUIVALENT_TO_V1_9_0: PASS")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build/test tooling
        run: python -m pip install --upgrade uv pytest twine

      - name: Run package tests
        working-directory: tools/promptvault-cli
        run: python -m pytest tests -q

      - name: Build wheel and sdist
        working-directory: tools/promptvault-cli
        run: uv build

      - name: Verify metadata, entry point and content
        run: |
          python - <<'PY'
          import sys
          import zipfile
          import tarfile
          from pathlib import Path

          dist = Path("tools/promptvault-cli/dist")
          wheels = sorted(dist.glob("promptvault_lite_manager-1.9.0-*.whl"))
          sdists = sorted(dist.glob("promptvault_lite_manager-1.9.0.tar.gz"))

          if not wheels:
              sys.exit("STOP: expected wheel promptvault_lite_manager-1.9.0-py3-none-any.whl not found")
          if not sdists:
              sys.exit("STOP: expected sdist promptvault_lite_manager-1.9.0.tar.gz not found")

          wheel = wheels[0]
          sdist = sdists[0]

          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
              meta_member = next(n for n in names if n.endswith(".dist-info/METADATA"))
              entry_member = meta_member.replace("METADATA", "entry_points.txt")
              metadata = zf.read(meta_member).decode("utf-8", "replace")
              entry_points = zf.read(entry_member).decode("utf-8", "replace")

          assert "Name: promptvault-lite-manager" in metadata, "STOP: distribution name mismatch"
          assert "Version: 1.9.0" in metadata, "STOP: distribution version mismatch"
          assert "promptvault = promptvault_cli.cli:main" in entry_points, "STOP: entry point mismatch"

          with tarfile.open(sdist) as tf:
              pkg_info_member = next(
                  m for m in tf.getmembers() if m.name.endswith("/PKG-INFO")
              )
              pkg_info = tf.extractfile(pkg_info_member).read().decode("utf-8", "replace")
          assert "Name: promptvault-lite-manager" in pkg_info, "STOP: sdist name mismatch"
          assert "Version: 1.9.0" in pkg_info, "STOP: sdist version mismatch"

          forbidden_members = (".exe", ".onnx", ".env", ".pem", ".key")
          forbidden_content = (
              "-----BEGIN",
              "PRIVATE KEY",
              r"C:\\Users",
              "C:/Users",
              "/home/",
              "/Users/",
          )

          def scan_members(names):
              for name in names:
                  low = name.lower()
                  for f in forbidden_members:
                      if f in low:
                          sys.exit(f"STOP: forbidden content in archive member: {name}")

          def scan_text(text, where):
              for f in forbidden_content:
                  if f.lower() in text.lower():
                      sys.exit(f"STOP: forbidden content '{f}' found in {where}")

          with zipfile.ZipFile(wheel) as zf:
              scan_members(zf.namelist())
              for name in zf.namelist():
                  if name.endswith((".py", "METADATA", "entry_points.txt")):
                      scan_text(zf.read(name).decode("utf-8", "replace"), f"wheel:{name}")

          with tarfile.open(sdist) as tf:
              scan_members(tf.getnames())
              for m in tf.getmembers():
                  if m.isfile():
                      scan_text(tf.extractfile(m).read().decode("utf-8", "replace"), f"sdist:{m.name}")

          print("DISTRIBUTION_VALIDATION: PASS")
          print(f"  wheel: {wheel.name}")
          print(f"  sdist: {sdist.name}")
          PY

      - name: twine check
        working-directory: tools/promptvault-cli
        run: twine check dist/*

      - name: Smoke test built wheel in isolation
        working-directory: tools/promptvault-cli
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          wheel="$(ls dist/promptvault_lite_manager-1.9.0-py3-none-any.whl)"
          uv tool install "$wheel"
          promptvault --version | tee /tmp/version.txt
          grep -q "1.9.0" /tmp/version.txt
          promptvault --help > /dev/null
          promptvault doctor
          uv tool uninstall promptvault-lite-manager
          echo "WHEEL_SMOKE_TEST: PASS"

      - name: Record distribution hashes
        working-directory: tools/promptvault-cli/dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: promptvault-lite-manager-dist
          path: tools/promptvault-cli/dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: release-build
    environment:
      name: pypi
      url: https://pypi.org/p/promptvault-lite-manager
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: promptvault-lite-manager-dist
          path: dist/

      - name: Verify downloaded distribution hashes
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Verify expected distributions and remove hash manifest
        run: |
          set -euo pipefail
          test -f "dist/promptvault_lite_manager-1.9.0-py3-none-any.whl" || {
            echo "::error::STOP: wheel missing after download"
            exit 1
          }
          test -f "dist/promptvault_lite_manager-1.9.0.tar.gz" || {
            echo "::error::STOP: sdist missing after download"
            exit 1
          }
          rm -f dist/SHA256SUMS.txt

      - name: Publish to PyPI via OIDC Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
