name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Release tag to build and publish (must be an existing vX.Y.Z tag)"
        required: true
        default: "v1.11.1"
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.event.inputs.release_ref }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Fail-closed on unsupported release ref format
        run: |
          REF="${{ github.event.inputs.release_ref }}"
          case "$REF" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::release_ref must match vX.Y.Z (got '$REF')"
              exit 1
              ;;
          esac
          echo "VERSION=${REF#v}" >> "$GITHUB_ENV"

      - name: Checkout the exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_ref }}
          fetch-depth: 0

      - name: Verify the release ref is an existing tag
        run: |
          REF="${{ github.event.inputs.release_ref }}"
          git rev-parse --verify "refs/tags/${REF}" >/dev/null || {
            echo "::error::STOP: '${REF}' is not an existing tag"
            exit 1
          }
          HEAD_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/${REF}^{commit}")"
          test "$HEAD_SHA" = "$TAG_SHA" || {
            echo "::error::STOP: checked out commit does not match tag '${REF}'"
            exit 1
          }

      - name: Verify package version matches the release tag
        run: |
          PKG_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("tools/promptvault-cli/pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )"
          test "$PKG_VERSION" = "$VERSION" || {
            echo "::error::STOP: package version '${PKG_VERSION}' != tag version '${VERSION}'"
            exit 1
          }
          echo "PKG_VERSION=${PKG_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build/test tooling
        run: python -m pip install --upgrade uv pytest twine

      - name: Run package tests
        working-directory: tools/promptvault-cli
        run: python -m pytest tests -q

      - name: Build wheel and sdist
        working-directory: tools/promptvault-cli
        run: uv build

      - name: Verify metadata, entry point and content
        run: |
          python - <<'PY'
          import os
          import sys
          import zipfile
          import tarfile
          from pathlib import Path

          version = os.environ["VERSION"]
          dist = Path("tools/promptvault-cli/dist")
          wheels = sorted(dist.glob(f"promptvault_lite_manager-{version}-*.whl"))
          sdists = sorted(dist.glob(f"promptvault_lite_manager-{version}.tar.gz"))

          if not wheels:
              sys.exit(f"STOP: expected wheel promptvault_lite_manager-{version}-py3-none-any.whl not found")
          if not sdists:
              sys.exit(f"STOP: expected sdist promptvault_lite_manager-{version}.tar.gz not found")

          wheel = wheels[0]
          sdist = sdists[0]

          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
              meta_member = next(n for n in names if n.endswith(".dist-info/METADATA"))
              entry_member = meta_member.replace("METADATA", "entry_points.txt")
              metadata = zf.read(meta_member).decode("utf-8", "replace")
              entry_points = zf.read(entry_member).decode("utf-8", "replace")

          assert "Name: promptvault-lite-manager" in metadata, "STOP: distribution name mismatch"
          assert f"Version: {version}" in metadata, "STOP: distribution version mismatch"
          assert "promptvault = promptvault_cli.cli:main" in entry_points, "STOP: entry point mismatch"

          with tarfile.open(sdist) as tf:
              pkg_info_member = next(
                  m for m in tf.getmembers() if m.name.endswith("/PKG-INFO")
              )
              pkg_info = tf.extractfile(pkg_info_member).read().decode("utf-8", "replace")
          assert "Name: promptvault-lite-manager" in pkg_info, "STOP: sdist name mismatch"
          assert f"Version: {version}" in pkg_info, "STOP: sdist version mismatch"

          forbidden_members = (".exe", ".onnx", ".env", ".pem", ".key")
          forbidden_content = (
              "-----BEGIN",
              "PRIVATE KEY",
              r"C:\\Users",
              "C:/Users",
              "/home/",
              "/Users/",
          )

          def scan_members(names):
              for name in names:
                  low = name.lower()
                  for f in forbidden_members:
                      if f in low:
                          sys.exit(f"STOP: forbidden content in archive member: {name}")

          def scan_text(text, where):
              for f in forbidden_content:
                  if f.lower() in text.lower():
                      sys.exit(f"STOP: forbidden content '{f}' found in {where}")

          with zipfile.ZipFile(wheel) as zf:
              scan_members(zf.namelist())
              for name in zf.namelist():
                  if name.endswith((".py", "METADATA", "entry_points.txt")):
                      scan_text(zf.read(name).decode("utf-8", "replace"), f"wheel:{name}")

          with tarfile.open(sdist) as tf:
              scan_members(tf.getnames())
              for m in tf.getmembers():
                  if m.isfile():
                      scan_text(tf.extractfile(m).read().decode("utf-8", "replace"), f"sdist:{m.name}")

          print("DISTRIBUTION_VALIDATION: PASS")
          print(f"  wheel: {wheel.name}")
          print(f"  sdist: {sdist.name}")
          PY

      - name: twine check
        working-directory: tools/promptvault-cli
        run: twine check dist/*

      - name: Smoke test built wheel in isolation
        working-directory: tools/promptvault-cli
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          wheel="$(ls dist/promptvault_lite_manager-${VERSION}-py3-none-any.whl)"
          uv tool install "$wheel"
          promptvault --version | tee /tmp/version.txt
          grep -q "${VERSION}" /tmp/version.txt
          promptvault --help > /dev/null
          promptvault doctor
          uv tool uninstall promptvault-lite-manager
          echo "WHEEL_SMOKE_TEST: PASS"

      - name: Record distribution hashes
        working-directory: tools/promptvault-cli/dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: promptvault-lite-manager-dist
          path: tools/promptvault-cli/dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: release-build
    environment:
      name: pypi
      url: https://pypi.org/p/promptvault-lite-manager
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: promptvault-lite-manager-dist
          path: dist/

      - name: Verify downloaded distribution hashes
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Verify expected distributions and remove hash manifest
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.release_ref }}"
          VERSION="${REF#v}"
          test -f "dist/promptvault_lite_manager-${VERSION}-py3-none-any.whl" || {
            echo "::error::STOP: wheel missing after download"
            exit 1
          }
          test -f "dist/promptvault_lite_manager-${VERSION}.tar.gz" || {
            echo "::error::STOP: sdist missing after download"
            exit 1
          }
          rm -f dist/SHA256SUMS.txt

      - name: Publish to PyPI via OIDC Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
