name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Frontend Unit/Integration (E3/E4/E5/E6 + Harness-Contract-Tests)
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend Unit/Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (E5)
        run: npx tsc --noEmit

      - name: Lint (E4)
        run: pnpm lint

      - name: Unit/Integration tests (E3)
        run: pnpm test

      - name: Build (E6)
        run: pnpm build

  # ─────────────────────────────────────────────────────────────────────────
  # Rust (E7/E8/E9)
  # ─────────────────────────────────────────────────────────────────────────
  rust:
    name: Rust (Tauri Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Format check (E7)
        working-directory: src-tauri
        run: cargo fmt --check --all

      - name: Clippy (E9)
        working-directory: src-tauri
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Test (E8)
        working-directory: src-tauri
        run: cargo test --workspace --locked

  # ─────────────────────────────────────────────────────────────────────────
  # Secret Scan (E10)
  # ─────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Run harness secret scan (E10)
        run: |
          pnpm install --frozen-lockfile
          node scripts/verify-all.mjs --gate E10 --no-color

  # ─────────────────────────────────────────────────────────────────────────
  # Playwright Chromium (E11-Leg + E15 Structural Evidence)
  # ─────────────────────────────────────────────────────────────────────────
  playwright-chromium:
    name: Playwright Chromium (E11/E15)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Renderer E2E + Journeys (E11 chromium)
        run: pnpm exec playwright test tests/e2e/core-flows.spec.ts tests/e2e/journeys.spec.ts --project=chromium
        env:
          CI: "true"

      - name: Visual Structural Evidence (E15)
        run: pnpm exec playwright test tests/e2e/visual-release-gate.spec.ts --project=chromium
        env:
          CI: "true"

  # ─────────────────────────────────────────────────────────────────────────
  # Playwright Firefox (E11-Leg) — kein continue-on-error: roter Browser = rotes E11
  # ─────────────────────────────────────────────────────────────────────────
  playwright-firefox:
    name: Playwright Firefox (E11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps firefox

      - name: Renderer E2E + Journeys (E11 firefox)
        run: pnpm exec playwright test tests/e2e/core-flows.spec.ts tests/e2e/journeys.spec.ts --project=firefox
        env:
          CI: "true"

  # ─────────────────────────────────────────────────────────────────────────
  # Playwright WebKit (E11-Leg) — kein continue-on-error
  # ─────────────────────────────────────────────────────────────────────────
  playwright-webkit:
    name: Playwright WebKit (E11)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps webkit

      - name: Renderer E2E + Journeys (E11 webkit)
        run: pnpm exec playwright test tests/e2e/core-flows.spec.ts tests/e2e/journeys.spec.ts --project=webkit
        env:
          CI: "true"

  # ─────────────────────────────────────────────────────────────────────────
  # Accessibility (E16 — Pflicht-Gate)
  # ─────────────────────────────────────────────────────────────────────────
  accessibility:
    name: Accessibility (E16)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Accessibility (E16)
        run: pnpm exec playwright test tests/e2e/accessibility.spec.ts --project=chromium
        env:
          CI: "true"

  # ─────────────────────────────────────────────────────────────────────────
  # Tauri debug build — teilt Binary + Bundle + dist mit E18/E19/E20
  # ─────────────────────────────────────────────────────────────────────────
  build-tauri-debug:
    name: Build Tauri Debug Binary
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libfuse2

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri debug binary + bundles
        # deb,rpm explizit: AppImage-Bundling (targets:"all") hängt lokal und
        # in CI >19min (linuxdeploy) — E18/E20 prüfen nur deb+rpm.
        run: pnpm tauri build --debug --bundles deb,rpm
        env:
          CI: "true"

      - name: Upload artifacts (binary + bundles + dist)
        uses: actions/upload-artifact@v4
        with:
          name: tauri-debug-artifacts
          path: |
            target/debug/promptvault-lite
            target/debug/bundle
            dist
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────
  # Build Artifact Integrity (E18 — Pflicht)
  # ─────────────────────────────────────────────────────────────────────────
  build-artifact-integrity:
    name: Build Artifact Integrity (E18)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-tauri-debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-debug-artifacts
          path: .

      - name: Build Artifact Integrity (E18)
        run: node scripts/verify-all.mjs --gate E18 --no-color

  # ─────────────────────────────────────────────────────────────────────────
  # Native Tauri Real E2E (E19 — Pflicht, echter WebDriver-Lauf)
  # Der Jobname ist nur zulässig, weil die App WIRKLICH über WebDriver
  # (tauri-driver + WebdriverIO) bedient wird — kein Datei-Existenz-Smoke.
  # ─────────────────────────────────────────────────────────────────────────
  native-tauri-real-e2e:
    name: Native Tauri Real E2E (E19)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-tauri-debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            webkit2gtk-driver \
            xvfb \
            python3-xlib \
            xdotool

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-debug-artifacts
          path: .

      - name: Native Tauri Real E2E (E19)
        run: node scripts/e19-gate.mjs
        env:
          CI: "true"

  # ─────────────────────────────────────────────────────────────────────────
  # Packaging Smoke (E20 — Pflicht, dpkg-deb-basiert)
  # ─────────────────────────────────────────────────────────────────────────
  packaging-smoke:
    name: Packaging Smoke (E20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-tauri-debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-debug-artifacts
          path: .

      - name: Packaging Smoke (E20)
        run: node scripts/verify-all.mjs --gate E20 --no-color
